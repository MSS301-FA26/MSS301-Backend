spring.application.name=api-gateway
spring.config.import=optional:file:.env[.properties],optional:file:cinema-services/api-gateway/.env[.properties],optional:file:services/api-gateway/.env[.properties],optional:file:api-gateway/.env[.properties]

server.port=${SERVER_PORT}
app.gateway.secret=${INTERNAL_GATEWAY_SECRET}

# 1. Identity Service Route
spring.cloud.gateway.routes[0].id=identity-service
spring.cloud.gateway.routes[0].uri=${IDENTITY_SERVICE_URI}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/admin/users/**,/api/v1/admin/staff-profiles/**

# 2. Catalog Service Route
spring.cloud.gateway.routes[1].id=catalog-service
spring.cloud.gateway.routes[1].uri=${CATALOG_SERVICE_URI}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/movies/**,/api/v1/genres/**,/api/v1/actors/**,/api/v1/cinema,/api/v1/cinema/**,/api/v1/cinemas/**,/api/v1/rooms/**,/api/v1/seats/**,/api/v1/showtimes/**,/api/v1/foods/**,/api/v1/ticket-pricing/**,/api/v1/catalog/**,/api/v1/admin/movies/**,/api/v1/admin/showtimes/**,/api/v1/admin/rooms/**,/api/v1/admin/foods/**,/api/v1/admin/ticket-pricing/**,/api/v1/admin/genres/**,/api/v1/admin/actors/**,/api/v1/admin/cinema

# 3. Booking Service Route
spring.cloud.gateway.routes[2].id=booking-service
spring.cloud.gateway.routes[2].uri=${BOOKING_SERVICE_URI}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/bookings/**,/api/v1/food-orders/**,/api/v1/staff/check-in/**,/api/v1/admin/bookings/**

# 4. Payment Service Route
spring.cloud.gateway.routes[3].id=payment-service
spring.cloud.gateway.routes[3].uri=${PAYMENT_SERVICE_URI}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/payments/**,/api/v1/wallets/**,/api/v1/loyalty/**,/api/v1/admin/payments/**,/api/v1/admin/refunds/**

# 5. Recommendation Service Route
spring.cloud.gateway.routes[4].id=recommendation-service
spring.cloud.gateway.routes[4].uri=${RECOMMENDATION_SERVICE_URI}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/recommendation/**,/api/v1/recommendations/**

# 6. Swagger Docs Route for Identity Service
spring.cloud.gateway.routes[5].id=identity-swagger
spring.cloud.gateway.routes[5].uri=${IDENTITY_SERVICE_URI}
spring.cloud.gateway.routes[5].predicates[0]=Path=/v3/api-docs/identity/**
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/v3/api-docs/identity(?<segment>.*), /v3/api-docs$\{segment}


# Global CORS Configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET, POST, PUT, DELETE, PATCH, OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# Deduplicate CORS headers from downstream microservices
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Methods Access-Control-Allow-Headers, RETAIN_FIRST

# Actuator Management
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always

# SpringDoc OpenAPI Gateway Aggregation
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=Identity & Access Service
springdoc.swagger-ui.urls[0].url=/v3/api-docs/identity
springdoc.swagger-ui.urls[0].display-name=Identity & Access Service
spring.cloud.gateway.routes[6].id=catalog-swagger
spring.cloud.gateway.routes[6].uri=${CATALOG_SERVICE_URI}
spring.cloud.gateway.routes[6].predicates[0]=Path=/v3/api-docs/catalog
spring.cloud.gateway.routes[6].filters[0]=SetPath=/v3/api-docs
springdoc.swagger-ui.urls[1].name=Catalog Service
springdoc.swagger-ui.urls[1].url=/v3/api-docs/catalog
