spring.config.import=optional:file:.env[.properties],\
  optional:file:MSS301-Backend-dev/cinema-services/catalog-service/.env[.properties],\
  optional:file:cinema-services/catalog-service/.env[.properties],\
  optional:file:services/catalog-service/.env[.properties],\
  optional:file:catalog-service/.env[.properties]

spring.application.name=${APPLICATION_NAME:catalog-service}
server.port=${SERVER_PORT:8082}
server.address=${SERVER_ADDRESS:127.0.0.1}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/catalog_db}
spring.datasource.username=${DB_USERNAME:catalog_user}
spring.datasource.password=${DB_PASSWORD:catalog_pass_123}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:false}
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=${FLYWAY_VALIDATE_ON_MIGRATE:false}
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/demo}

# Actuator
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,info}
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:never}

# Gateway Security & Internal Security
app.gateway.secret=${INTERNAL_GATEWAY_SECRET:8F78D52690EED1A48867F89272F07391B8FBC8968F187BB5C53C60E20243D7AD}
app.internal.secret=${INTERNAL_SERVICE_SECRET:CF419427F61EE9D8880297E0309BDFB4504B8917C10B7019A56B1562344DDA03}
app.jwt.secret=${JWT_SECRET:cineai-development-secret-key-please-change-123456}
app.quote.ttl-seconds=${QUOTE_TTL_SECONDS:300}
logging.pattern.level=${LOG_LEVEL_PATTERN:%5p}

# SpringDoc OpenAPI (Swagger UI disabled on microservice port 8082, only api-docs enabled for Gateway)
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=false

# Cloudinary & Multipart Upload
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dmcodhbcc}
cloudinary.api-key=${CLOUDINARY_API_KEY:979326239991974}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:br5oiSrTIhXkAWkUMWx4EeXz6LI}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:100MB}

# External Services
booking.service.url=${BOOKING_SERVICE_URL:http://localhost:8083}
