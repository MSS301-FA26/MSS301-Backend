spring.application.name=catalog-service
spring.config.import=optional:file:.env[.properties],optional:file:cinema-services/catalog-service/.env[.properties],optional:file:services/catalog-service/.env[.properties],optional:file:catalog-service/.env[.properties]

server.port=${SERVER_PORT}

# Database Configuration (Port 5432)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
