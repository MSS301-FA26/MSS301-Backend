spring.config.import=optional:file:.env[.properties],optional:file:cinema-services/catalog-service/.env[.properties],optional:file:services/catalog-service/.env[.properties],optional:file:catalog-service/.env[.properties]

spring.application.name=${APPLICATION_NAME}
server.port=${SERVER_PORT}
server.address=${SERVER_ADDRESS}

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=false
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW}
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration
spring.flyway.enabled=${FLYWAY_ENABLED}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=${FLYWAY_LOCATIONS}

# Actuator
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS}
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS}

# Gateway Security & Internal Security
app.gateway.secret=${INTERNAL_GATEWAY_SECRET}
app.internal.secret=${INTERNAL_SERVICE_SECRET}
app.jwt.secret=${JWT_SECRET}
app.quote.ttl-seconds=${QUOTE_TTL_SECONDS}
logging.pattern.level=${LOG_LEVEL_PATTERN}

# SpringDoc OpenAPI (Swagger UI disabled on microservice port 8082, only api-docs enabled for Gateway)
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=false

# Cloudinary & Multipart Upload
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE}

# External Services
booking.service.url=${BOOKING_SERVICE_URL:http://localhost:8083}

