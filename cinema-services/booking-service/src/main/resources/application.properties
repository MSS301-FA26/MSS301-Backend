spring.application.name=booking-service
spring.config.import=optional:file:.env[.properties],optional:file:cinema-services/booking-service/.env[.properties],optional:file:services/booking-service/.env[.properties],optional:file:booking-service/.env[.properties]

server.port=${SERVER_PORT:8083}

# Database Configuration (Port 5433)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/booking_db}
spring.datasource.username=${DB_USERNAME:booking_user}
spring.datasource.password=${DB_PASSWORD:booking_pass_123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# RabbitMQ (Event Broker)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Catalog Internal Service URL
catalog.service.url=${CATALOG_SERVICE_URL:http://localhost:8082}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Gateway Security (Zero-trust: only API Gateway is allowed)
app.gateway.secret=${INTERNAL_GATEWAY_SECRET:8F78D52690EED1A48867F89272F07391B8FBC8968F187BB5C53C60E20243D7AD}
app.internal.secret=${INTERNAL_SERVICE_SECRET:CF419427F61EE9D8880297E0309BDFB4504B8917C10B7019A56B1562344DDA03}
app.jwt.secret=${JWT_SECRET:cineai-development-secret-key-please-change-123456}
app.gateway.url=${GATEWAY_URL:http://localhost:8080}

# SpringDoc OpenAPI
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=false
