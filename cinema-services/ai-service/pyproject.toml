[project]
name = "ai-service"
version = "0.1.0"
description = "CinemaAI Intelligent Services (Search, Recommendations, Chatbot)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "openai>=3.15.0",
    "pandas>=3.0.6",
    "pika>=1.4.4",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.1",
    "uvicorn>=0.53.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
