spring.application.name=${APPLICATION_NAME}
spring.config.import=optional:file:.env[.properties],optional:file:cinema-services/identity-service/.env[.properties],optional:file:services/identity-service/.env[.properties],optional:file:identity-service/.env[.properties]

server.port=${SERVER_PORT}
server.address=${SERVER_ADDRESS}

# Database Configuration (Port 5431 or Neon cloud)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=false
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW}
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration
spring.flyway.enabled=${FLYWAY_ENABLED}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=${FLYWAY_LOCATIONS}

# JWT Security
app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS}

# Mail / SMTP Configuration
app.mail.enabled=${MAIL_ENABLED}
app.mail.from=${MAIL_FROM}
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE}

# Google OAuth
app.google.client-id=${GOOGLE_OAUTH_CLIENT_ID}
app.google.token-info-base-url=${GOOGLE_TOKEN_INFO_BASE_URL}

# Seed Accounts
app.seeders.account.admin.email=${SEED_ADMIN_EMAIL}
app.seeders.account.admin.password=${SEED_ADMIN_PASSWORD}
app.seeders.account.admin.full-name=${SEED_ADMIN_FULL_NAME}
app.seeders.account.admin.phone=${SEED_ADMIN_PHONE}

app.seeders.account.staff.email=${SEED_STAFF_EMAIL}
app.seeders.account.staff.password=${SEED_STAFF_PASSWORD}
app.seeders.account.staff.full-name=${SEED_STAFF_FULL_NAME}
app.seeders.account.staff.phone=${SEED_STAFF_PHONE}

# Gateway Security (Zero-trust: only API Gateway is allowed)
app.gateway.secret=${INTERNAL_GATEWAY_SECRET}
app.internal.secret=${INTERNAL_SERVICE_SECRET}
logging.pattern.level=${LOG_LEVEL_PATTERN}

# Actuator
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS}
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS}

# SpringDoc OpenAPI (Swagger UI tắt trên cổng con 8081, chỉ bật api-docs để Gateway đọc)
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=false
