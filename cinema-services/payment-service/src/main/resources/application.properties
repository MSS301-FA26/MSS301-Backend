vnpay.bulk-refund.timeout-seconds=${VNPAY_BULK_REFUND_TIMEOUT_SECONDS:30}
vnpay.bulk-refund.batch-size=${VNPAY_BULK_REFUND_BATCH_SIZE:10}

# SpringDoc OpenAPI
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=false
