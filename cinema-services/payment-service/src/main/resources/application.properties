spring.config.import=optional:file:.env[.properties],\
  optional:file:MSS301-Backend-dev/cinema-services/payment-service/.env[.properties],\
  optional:file:cinema-services/payment-service/.env[.properties],\
  optional:file:services/payment-service/.env[.properties],\
  optional:file:payment-service/.env[.properties]

spring.application.name=${APPLICATION_NAME}

server.port=${SERVER_PORT}
server.address=${SERVER_ADDRESS}

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL}

# Flyway Migration
spring.flyway.enabled=${FLYWAY_ENABLED}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE}
spring.flyway.locations=${FLYWAY_LOCATIONS}

# RabbitMQ Event Broker
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# VNPay Sandbox Configuration
vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.pay-url=${VNPAY_PAY_URL}
vnpay.api-query-url=${VNPAY_API_QUERY_URL}
vnpay.return-url=${VNPAY_RETURN_URL}
vnpay.ipn-url=${VNPAY_IPN_URL}
vnpay.default-client-ip=${VNPAY_DEFAULT_CLIENT_IP}
vnpay.payment-success-redirect-url=${PAYMENT_SUCCESS_REDIRECT_URL}
vnpay.success-redirect-url=${PAYMENT_SUCCESS_REDIRECT_URL}

# Booking Service Internal URL
booking.service.url=${BOOKING_SERVICE_URL}

# Actuator Management
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS}
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS}

# Shared secret between API Gateway and downstream microservices
app.gateway.secret=${INTERNAL_GATEWAY_SECRET}
app.internal.secret=${INTERNAL_SERVICE_SECRET}
app.jwt.secret=${JWT_SECRET}
app.gateway.url=${GATEWAY_URL}

# Bulk Refunds & Retry Configuration
bulk.refund.enable=${BULK_REFUND_ENABLE}
bulk.refund.retry.max-attempts=${BULK_REFUND_RETRY_MAX_ATTEMPTS}
bulk.refund.retry.delay-seconds=${BULK_REFUND_RETRY_DELAY_SECONDS}
bulk.refund.notification.enabled=${BULK_REFUND_NOTIFICATION_ENABLED}
vnpay.bulk-refund.timeout-seconds=${VNPAY_BULK_REFUND_TIMEOUT_SECONDS}
vnpay.bulk-refund.batch-size=${VNPAY_BULK_REFUND_BATCH_SIZE}

# SpringDoc OpenAPI
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED}
springdoc.api-docs.path=${SPRINGDOC_API_DOCS_PATH}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED}
