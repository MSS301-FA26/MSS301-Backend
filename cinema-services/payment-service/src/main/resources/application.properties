# Bulk Refunds & Retry Configuration
bulk.refund.enable=${BULK_REFUND_ENABLE:true}
bulk.refund.retry.max-attempts=${BULK_REFUND_RETRY_MAX_ATTEMPTS:3}
bulk.refund.retry.delay-seconds=${BULK_REFUND_RETRY_DELAY_SECONDS:60}
