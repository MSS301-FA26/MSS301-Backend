spring.config.import=optional:file:.env[.properties],\
  optional:file:MSS301-Backend-dev/cinema-services/payment-service/.env[.properties],\
  optional:file:cinema-services/payment-service/.env[.properties],\
  optional:file:services/payment-service/.env[.properties],\
  optional:file:payment-service/.env[.properties]

spring.application.name=${APPLICATION_NAME:payment-service}

server.port=${SERVER_PORT:8084}
server.address=${SERVER_ADDRESS:127.0.0.1}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/payment_db}
spring.datasource.username=${DB_USERNAME:payment_user}
spring.datasource.password=${DB_PASSWORD:payment_pass_123}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:false}
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}

# RabbitMQ Event Broker
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# VNPay Sandbox Configuration
