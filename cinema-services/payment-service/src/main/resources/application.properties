vnpay.ipn-url=${VNPAY_IPN_URL:http://localhost:8080/api/v1/payments/vnpay/ipn}
vnpay.default-client-ip=${VNPAY_DEFAULT_CLIENT_IP:127.0.0.1}
vnpay.payment-success-redirect-url=${PAYMENT_SUCCESS_REDIRECT_URL:http://localhost:3000/payment-callback}
vnpay.success-redirect-url=${PAYMENT_SUCCESS_REDIRECT_URL:http://localhost:3000/payment-callback}


