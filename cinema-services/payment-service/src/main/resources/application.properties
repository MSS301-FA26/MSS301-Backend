spring.application.name=${APPLICATION_NAME}
spring.config.import=optional:file:.env[.properties],optional:file:cinema-services/payment-service/.env[.properties],optional:file:services/payment-service/.env[.properties],optional:file:payment-service/.env[.properties]

server.port=${SERVER_PORT}
server.address=${SERVER_ADDRESS}

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=false
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW}
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration
spring.flyway.enabled=${FLYWAY_ENABLED}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=${FLYWAY_LOCATIONS}

# RabbitMQ (Event Broker)
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# VNPay Configuration
vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.pay-url=${VNPAY_PAY_URL}
vnpay.return-url=${VNPAY_RETURN_URL}
vnpay.success-redirect-url=${PAYMENT_SUCCESS_REDIRECT_URL}

# Booking Service Internal URL
booking.service.url=${BOOKING_SERVICE_URL}

# Actuator
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS}
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS}

# Gateway Security (Zero-trust: only API Gateway is allowed)
app.gateway.secret=${INTERNAL_GATEWAY_SECRET}
app.internal.secret=${INTERNAL_SERVICE_SECRET}
app.jwt.secret=${JWT_SECRET}
app.gateway.url=${GATEWAY_URL}

# SpringDoc OpenAPI
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=false
